<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字镂空效果</title>
    <style>
        body {
            background-color: #000;
            /* display: flex;
            justify-content: center;
            align-items: center; */
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .effect-1 {
            font-size: 120px;
            font-weight: 900;
            font-family: "Arial Black", "Microsoft YaHei", sans-serif;
            color: #00ff00;
            position: relative;
            letter-spacing: 2px;
        }
        /* 第一层黑色轮廓 */
        .effect-1::before {
            content: "标题";
            position: absolute;
            top: 4px;
            left: 4px;
            color: transparent;
            -webkit-text-stroke: 8px #000;
            text-stroke: 8px #000;
            z-index: -1;
        }
        /* 第二层更细黑色轮廓 */
        .effect-1::after {
            content: "标题";
            position: absolute;
            top: 2px;
            left: 2px;
            color: transparent;
            -webkit-text-stroke: 4px #000;
            text-stroke: 4px #000;
            z-index: -2;
        }
        .box {
            width: 200px;
            height: 200px;
            background-color: #eee;
        }
    </style>
</head>
<body>
    <div class="box">
        <canvas id="canvas" width="400" height="400"></canvas>
    </div>
    <svg width=" 100%" height="'100%" viewBox="0 0 500 500" fill="none"
        xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <rect x="20" y="20" width="460" height="460" fill="#fff"
            stroke="url(#02d10_gradient)" stroke-width="10"
            stroke-dasharray="40 40"></rect>
        <defs>
            <linearGradient id="02d10_gradient" x1="49%" y1="100%" x2="50%"
                y2="0%">
                <stop offset="0.00%" stop-color="rgba(255,255,25,1)"></stop>
                <stop offset="100.00%" stop-color="rgba(0,255,0,1)"></stop>
            </linearGradient>
        </defs>
    </svg>
    <svg hidden id="svg_text" width="400" height="200"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 定义深绿色外轮廓滤镜 -->
            <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feMorphology in="SourceAlpha" operator="dilate" radius="4"
                    result="thicker" />
                <feFlood flood-color="#006400" result="glowColor" />
                <feComposite in="glowColor" in2="thicker" operator="in"
                    result="softGlow" />
                <feMerge>
                    <feMergeNode in="softGlow" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
        <!-- 黑色背景矩形 -->
        <rect width="100%" height="100%" fill="black" />
        <!-- 文字 -->
        <text x="50%" y="55%" font-family="sans-serif" font-size="120"
            font-weight="bold" text-anchor="middle" dominant-baseline="middle"
            stroke="#00ff00" stroke-width="8" fill="transparent"
            filter="url(#outerGlow)">
            标题
        </text>
    </svg>
    <svg hidden xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="图层_1"
        x="0px" y="0px" viewBox="0 0 1242 1260.1"
        enable-background="new 0 0 1242 1260.1" xml:space="preserve">
        <g>

    <script>
        const svgUrl = [
            // 'https://js.pngtree.com/editor/assets/svg_v_29.svg',
            'https://js.pngtree.com/editor/assets/svg_v_34.svg',
            // 'https://js.pngtree.com/editor/assets/svg_v_15.svg',
            // 'https://js.pngtree.com/editor/assets/svg_v_21.svg',
            // 'https://js.pngtree.com/editor/assets/svg_v_42.svg',
            // 'https://js.pngtree.com/editor/assets/svg_v_156.svg',
        ]
        window.onload = function() {
            console.log('fabric version:', fabric.version);
            const svgs = document.querySelectorAll('svg')
            svgs.forEach((svg, index) => {
                const descendants = Array.from(svg
                    .getElementsByTagName('*'))
                console.log(index, descendants);
            })
            var canvas = new fabric.Canvas('canvas');
            svgUrl.forEach(url => {
                fabric.loadSVGFromURL(url, function(objects,
                    options) {
                    var obj = fabric.util.groupSVGElements(
                        objects,
                        options);
                    const scale = fabric.util
                        .findScaleToFit(obj, {
                            width: 300,
                            height: 300
                        })
                    obj.set({
                        scaleX: scale,
                        scaleY: scale
                    })
                    canvas.add(obj).renderAll();
                });
            })
        }
    </script>
