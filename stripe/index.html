<html lang="zh">

<head>
  <meta charset="UTF-8">
  <title>Stripe 支付表单</title>
  <script src="https://js.stripe.com/v3/" type="c7cd61a632eb578ab897c5fb-text/javascript"></script>
  <style>
    body {
      background-color: #f6f9fc;
      font-family: Arial, sans-serif;
    }

    .payment-card {
      width: 400px;
      height: 500px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin: 80px auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .payment-card h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    #payment-element {
      margin-bottom: 20px;
    }

    #submit {
      padding: 12px;
      font-size: 16px;
      background-color: #72bd87;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    #submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="payment-card">
    <h2>订阅支付</h2>
    <div id="payment-element">
      <!-- Stripe 自动生成的输入表单 -->
    </div>
    <button id="submit">确认支付</button>
    <div class="message" id="message-box"></div>
  </div>


  <script>
    // 假设已注入 Stripe 公钥
    const injectData = {
      stripe_pub: 'pk_test_51PJBRyDST8rvPUCj9kqY5FRfR8cLI6X114vKB5n1jhByDrm81MpUyXtkqctyKnYgMcmmLSefCQUJREO1ycSTz7yB00uNsBeq7B', // 替换为你的公钥
      od: 'ORDER_ID_001', // 示例订单号
    };


    const type = 10;
    const click_type = 86;
    let stripe;
    let elements;
    let intentId = ''; // 提升为全局

    async function initialize() {
      if (!injectData.stripe_pub) {
        document.getElementById('message-box').innerText = 'Stripe 公钥未设置';
        return;
      }

      stripe = Stripe(injectData.stripe_pub);

      // 获取 client_secret
      try {
        const res = await fetch('https://test-new.lovepik.com/pay/stripeInitFree', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: type,
            click_type: click_type,
          }),
        });

        const data = await res.json();

        if (data.status !== 200) {
          document.getElementById('message-box').innerText = '初始化失败';
          return;
        }

        const clientSecret = data.data;
        intentId = data.id; // 保存 intentId

        const appearance = {
          theme: 'flat',
          variables: {
            colorPrimary: '#72bd87',
            colorBackground: '#ffffff',
            borderRadius: '6px',
            spacingUnit: '4px'
          }
        };

        elements = stripe.elements({ clientSecret: clientSecret, appearance });
        const paymentElement = elements.create("payment");
        paymentElement.mount("#payment-element");

      } catch (err) {
        console.error(err);
        document.getElementById('message-box').innerText = '初始化接口调用异常';
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      document.getElementById("submit").disabled = true;
      document.getElementById('message-box').innerText = '';

      try {
        const { error, setupIntent } = await stripe.confirmSetup({
          elements,
          confirmParams: {
            return_url: "https://your-site.com/stripe-callback", // 成功后跳转的地址
          },
          redirect: "if_required",
        });

        if (error) {
          document.getElementById('message-box').innerText = error.message;
        } else {
          const formData = new URLSearchParams();
          formData.append('setup_intent_id', setupIntent.id);
          formData.append('type', type);
          formData.append('click_type', click_type);
          formData.append('email', '907530489@qq.com');

          // ✅ 调用后端接口，将 intentId 传过去
          const backendRes = await fetch('https://test-new.lovepik.com/pay/stripeFee', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
          });

          const result = await backendRes.json();
          if (result.success) {
            document.getElementById('message-box').innerText = '✅ 订阅创建成功';
          } else {
            document.getElementById('message-box').innerText = '订阅失败：' + result.message;
          }
        }
      } catch (err) {
        console.error(err);
        document.getElementById('message-box').innerText = '支付异常';
      } finally {
        document.getElementById("submit").disabled = false;
      }
    }

    document.getElementById("submit").addEventListener("click", handleSubmit);

    initialize();

  </script>

</body>

</html>
